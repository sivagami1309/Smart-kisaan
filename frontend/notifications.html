<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ec">
  <title>Smart Kisaan – Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .note-item { display: flex; gap: 12px; align-items: flex-start; text-decoration: none; color: inherit; }
    .note-item .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--paddy-tint); display: grid; place-items: center; font-size: 22px; flex: none; }
    .note-item b { display: block; font-size: 17px; font-weight: 800; line-height: 1.3; }
    .note-item.unread { border-color: var(--paddy); }
    .note-item.unread b::after { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--tomato); margin-left: 8px; vertical-align: middle; }
  </style>
</head>
<body>
<div class="app">
  <header class="head">
    <a class="icon-btn" href="home.html" aria-label="Back"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" stroke="#2e2016" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 data-i18n="title">அறிவிப்புகள்</h1>
  </header>
  <main class="page">
    <button class="btn btn-ghost" id="allRead" type="button" data-i18n="allRead">எல்லாம் படித்ததாகக் குறி</button>
    <div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
  </main>
</div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script>
  const T = {
    ta: {
      title: 'அறிவிப்புகள்', allRead: 'எல்லாம் படித்ததாகக் குறி', empty: 'புதிய அறிவிப்பு இல்லை.',
      kinds: {
        POOL_PROPOSED: n => `${n} உங்களுடன் சேர்ந்து அனுப்பக் கேட்கிறார்`, POOL_ACCEPTED: n => `${n} சம்மதம் தந்தார்`,
        POOL_CONFIRMED: n => `${n} சம்மதம் தந்தார் – இருவரும் ஒப்புக்கொண்டீர்கள்`, POOL_TRANSPORT: n => `${n} வண்டி ஏற்பாடு செய்தார்`,
        POOL_SOLD: n => `${n} விற்பனையைப் பதிவு செய்தார்`, POOL_COMPLETED: n => `${n} கூட்டு விற்பனையை முடித்தார்`, POOL_CANCELLED: n => `${n} கூட்டு விற்பனையை ரத்து செய்தார்`,
      },
      someone: 'ஒரு விவசாயி',
    },
    en: {
      title: 'Notifications', allRead: 'Mark all as read', empty: 'No new notifications.',
      kinds: {
        POOL_PROPOSED: n => `${n} asks to send produce together with you`, POOL_ACCEPTED: n => `${n} agreed`,
        POOL_CONFIRMED: n => `${n} agreed – you are both in`, POOL_TRANSPORT: n => `${n} arranged the vehicle`,
        POOL_SOLD: n => `${n} recorded the sale`, POOL_COMPLETED: n => `${n} finished the shared sale`, POOL_CANCELLED: n => `${n} cancelled the shared sale`,
      },
      someone: 'A farmer',
    },
  }[UI.lang];
  UI.apply(T);
  const $ = id => document.getElementById(id);
  const ICON = { POOL_PROPOSED: '🤝', POOL_ACCEPTED: '✅', POOL_CONFIRMED: '✅', POOL_TRANSPORT: '🚚', POOL_SOLD: '💰', POOL_COMPLETED: '🎉', POOL_CANCELLED: '✖️' };

  async function load() {
    let r;
    try { r = await SK.notifications.list(); } catch (e) { $('list').innerHTML = `<p class="empty">${UI.esc(UI.errText(e))}</p>`; return; }
    if (!r.items.length) { $('list').innerHTML = `<p class="empty">${T.empty}</p>`; return; }
    $('list').innerHTML = r.items.map(n => `
      <a class="card note-item ${n.read ? '' : 'unread'}" data-id="${n.id}" href="together.html?pool=${UI.esc(n.poolId)}">
        <span class="ico" aria-hidden="true">${ICON[n.kind] ?? '🔔'}</span>
        <span><b>${UI.esc((T.kinds[n.kind] ?? (x => x))(n.actorName || T.someone))}</b><span class="meta">${UI.time(n.createdAt)}</span></span>
      </a>`).join('');
    // Mark read first, then open the pool (navigating straight away could cancel the request)
    $('list').querySelectorAll('a[data-id]').forEach(a => a.addEventListener('click', async e => {
      e.preventDefault();
      await SK.notifications.read([Number(a.dataset.id)]).catch(() => {});
      location.href = a.getAttribute('href');
    }));
  }
  $('allRead').addEventListener('click', async () => { await SK.notifications.read().catch(() => {}); load(); });
  load();
</script>
</body>
</html>
